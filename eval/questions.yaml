# Evaluation questions for MCP memory layer experiment
# Based on jaffle_shop v3 schema (dbt-labs/jaffle-shop)
#
# Schema overview:
#   Raw: raw_customers, raw_orders (amounts in CENTS), raw_items, raw_products, raw_stores, raw_supplies
#   Staging: stg_customers, stg_orders (amounts in DOLLARS + _cents cols), stg_order_items, stg_products, stg_locations, stg_supplies
#   Marts: customers, orders, order_items, products, locations, supplies

# =============================================================================
# A. CORRECTIONS (C01-C20)
# Test whether pre-seeded corrections prevent known mistakes
# =============================================================================

- id: "C01"
  question: "What's the total revenue across all orders?"
  target_features: [corrections]
  difficulty: medium
  expected:
    tables: [orders]
    columns: [order_total]
    filters: []
    join_keys: []
    notes: "Must NOT use raw_orders (cents). orders.order_total is in dollars."
  trap: "raw_orders.order_total is in cents, not dollars"
  scoring:
    correct_table: 2
    correct_column: 1
    correct_filter: 0
    correct_join: 0
    avoids_trap: 3


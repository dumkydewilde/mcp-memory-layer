[project]
name = "mcp-memory-experiment"
version = "0.1.0"
description = "MCP server with memory layer (corrections, dbt context, popularity) for better text-to-SQL"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "duckdb>=1.2",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "mcp-server-motherduck>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-memory = "mcp_memory.server:main"
mcp-memory-mdw = "mcp_memory.mdw_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
